<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configPilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: bold;
            color: #FFA500;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
        }

        .app-name {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .loading-container {
            width: 100%;
            max-width: 300px;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #FFA500, #FF8C00);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        @keyframes loading {
            0% {
                width: 0%;
                transform: translateX(-100%);
            }

            50% {
                width: 100%;
                transform: translateX(0%);
            }

            100% {
                width: 100%;
                transform: translateX(100%);
            }
        }

        .status-text {
            font-size: 0.9rem;
            color: #ccc;
            text-align: center;
            min-height: 1.2rem;
            opacity: 0.8;
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <div class="logo">CP</div>
        <div class="app-name">configPilot</div>
        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="status-text" id="status">Initializing application...</div>
        </div>
    </div>
    <div class="version">v1.0.0</div>

    <script>
        console.log('Splash screen script loaded');

        // Listen for status updates from main process
        if (window.electronAPI && window.electronAPI.onSplashStatus) {
            window.electronAPI.onSplashStatus((status) => {
                console.log('Received status update:', status);
                const statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.textContent = status;

                    // Send acknowledgment back to main process
                    if (window.electronAPI.sendStatusReceived) {
                        // Use requestAnimationFrame to ensure DOM update completes
                        requestAnimationFrame(() => {
                            window.electronAPI.sendStatusReceived();
                        });
                    }
                }
            });
        } else {
            console.warn('electronAPI not available');
        }

        // Ensure DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Splash screen DOM ready');
        });
    </script>
</body>

</html>
