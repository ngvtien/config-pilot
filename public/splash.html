<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configPilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none;
            outline: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background: rgba(10, 10, 10, 0.95); /* Semi-transparent background */
            border-radius: 12px; /* Rounded corners */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); /* Subtle shadow */
            backdrop-filter: blur(10px); /* Glass effect */        
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
        }

        /* Circuit Board Background */
        .circuit-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        /* Circuit Lines */
        .circuit-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: circuitFlow 3s linear infinite;
        }

        .circuit-line.horizontal {
            height: 1px;
            width: 100px;
        }

        .circuit-line.vertical {
            width: 1px;
            height: 100px;
        }

        /* Circuit Nodes */
        .circuit-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: nodePulse 2s ease-in-out infinite;
        }

        /* Electricity Flow */
        .electricity {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            box-shadow: 0 0 8px #00ffff;
            animation: electricityFlow 4s linear infinite;
        }

        /* Particle System */
        .particle {
            position: absolute;
            background: rgba(0, 255, 136, 0.3);
            animation: particleFloat 8s ease-in-out infinite;
        }

        @keyframes circuitFlow {
            0% { opacity: 0; transform: translateX(-50px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(50px); }
        }

        @keyframes nodePulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes electricityFlow {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .splash-container {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-align: center;
            padding: 1.5rem;
            z-index: 2;
            position: relative;
        }

        .logo-container {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #FFA500, #FF8C00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite, pulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 165, 0, 0.5);
            position: relative;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes logoGlow {
            0%, 100% { filter: brightness(1) saturate(1); }
            50% { filter: brightness(1.3) saturate(1.5); }
        }

        @keyframes glow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        .app-name {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
            opacity: 0.9;
            animation: textShimmer 3s ease-in-out infinite;
        }

        @keyframes textShimmer {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        .loading-container {
            width: 100%;
            max-width: 250px;
        }

        .loading-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
        }

        .loading-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 165, 0, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #FFA500, #FF8C00, #FFD700);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes loading {
            0% {
                width: 0%;
                transform: translateX(-100%);
            }
            50% {
                width: 100%;
                transform: translateX(0%);
            }
            100% {
                width: 100%;
                transform: translateX(100%);
            }
        }

        .status-text {
            font-size: 0.85rem;
            color: #ccc;
            text-align: center;
            min-height: 1.2rem;
            opacity: 0.8;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .version {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 0.7rem;
            color: #666;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="circuit-board">
        <!-- Enhanced Circuit Lines -->
        <div class="circuit-line horizontal" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="circuit-line horizontal" style="top: 40%; left: 60%; animation-delay: 1s;"></div>
        <div class="circuit-line horizontal" style="top: 70%; left: 20%; animation-delay: 2s;"></div>
        <div class="circuit-line horizontal" style="top: 85%; left: 50%; animation-delay: 3s;"></div>
        <div class="circuit-line vertical" style="top: 10%; left: 30%; animation-delay: 0.5s;"></div>
        <div class="circuit-line vertical" style="top: 50%; left: 80%; animation-delay: 1.5s;"></div>
        <div class="circuit-line vertical" style="top: 30%; left: 70%; animation-delay: 2.5s;"></div>
        <div class="circuit-line vertical" style="top: 60%; left: 15%; animation-delay: 3.5s;"></div>
        
        <!-- Enhanced Circuit Nodes -->
        <div class="circuit-node" style="top: 15%; left: 25%; animation-delay: 0s;"></div>
        <div class="circuit-node" style="top: 35%; left: 75%; animation-delay: 0.5s;"></div>
        <div class="circuit-node" style="top: 65%; left: 15%; animation-delay: 1s;"></div>
        <div class="circuit-node" style="top: 80%; left: 85%; animation-delay: 1.5s;"></div>
        <div class="circuit-node" style="top: 25%; left: 55%; animation-delay: 2s;"></div>
        <div class="circuit-node" style="top: 45%; left: 35%; animation-delay: 2.5s;"></div>
        <div class="circuit-node" style="top: 75%; left: 65%; animation-delay: 3s;"></div>
        
        <!-- Enhanced Electricity Flow -->
        <div class="electricity" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="electricity" style="top: 40%; left: 60%; animation-delay: 1s;"></div>
        <div class="electricity" style="top: 70%; left: 20%; animation-delay: 2s;"></div>
        <div class="electricity" style="top: 10%; left: 30%; animation-delay: 0.5s;"></div>
        <div class="electricity" style="top: 50%; left: 80%; animation-delay: 1.5s;"></div>
        <div class="electricity" style="top: 85%; left: 50%; animation-delay: 2.5s;"></div>
        <div class="electricity" style="top: 30%; left: 70%; animation-delay: 3s;"></div>
        
        <!-- Floating Particles -->
        <div class="particle" style="width: 3px; height: 3px; left: 20%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 2px; height: 2px; left: 40%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 60%; animation-delay: 4s;"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 80%; animation-delay: 6s;"></div>
    </div>
    
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo">CP</div>
        </div>
        <div class="app-name">configPilot</div>
        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="status-text" id="status">Initializing application...</div>
        </div>
    </div>
    <div class="version">v1.0.0</div>

    <script>
        console.log('Splash screen script loaded');

        // Listen for status updates from main process
        if (window.electronAPI && window.electronAPI.onSplashStatus) {
            window.electronAPI.onSplashStatus((status) => {
                console.log('Received status update:', status);
                const statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.textContent = status;

                    // Send acknowledgment back to main process
                    if (window.electronAPI.sendStatusReceived) {
                        requestAnimationFrame(() => {
                            window.electronAPI.sendStatusReceived();
                        });
                    }
                }
            });
        } else {
            console.warn('electronAPI not available');
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('Splash screen DOM ready');
        });
    </script>
</body>

</html>
